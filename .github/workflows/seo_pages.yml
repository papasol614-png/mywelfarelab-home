name: SEO pages and links
on:
  push:
    paths:
      - '*.html'
      - '*.css'
      - 'guides/**'
      - 'sitemap.xml'
      - 'tests/seo_links.test.js'
      - '.github/workflows/seo_pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate SEO metadata and all internal links
        run: node tests/seo_links.test.js
